spring:
  application:
    name: expense-service

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:expenseservice}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:123}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    topic-budget-alert:
      name: budget-alerts
    topic-user-deleted:
      name: user.deleted
    topic-expense-created:
      name: expense.created
    consumer:
      group-id: expenseService-group
      auto-offset-reset: earliest

    admin:
      auto-create: true


    template:
      observation-enabled: true
    listener:
      observation-enabled: true

server:
  port: 9810

logging:
  level:
    com.greatest.expenseService: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.springframework.kafka: INFO
    io.micrometer.tracing: DEBUG



eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

  endpoint:
    health:
      show-details: always
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    metrics:
      export:
        enabled: false
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

