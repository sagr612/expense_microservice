spring:
  application:
    name: user-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    baseline-on-migrate: true    # allow retrofit onto an existing DB (see Step 6)
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: true

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:userservice}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate


  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    topic-user-deleted:
      name: user.deleted
    listener:
      observation-enabled: true
    template:
      observation-enabled: true
    consumer:
      group-id: userinfo-consumer-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: sagar.userService.deserializer.UserInfoDeserializer
      auto-offset-reset: earliest

      properties:
        spring:
          json:
            trusted:
              packages: sagar.userService.dtos
            type:
              mapping: auth:sagar.userService.dtos.UserInfoDto

    topic-json:
      name: user.events

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 9001

logging:
  level:
    org.springframework.security: INFO
    sagar.userService: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
  url: ${CLOUDINARY_URL}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}


jwt:
  secret: ${JWT_SECRET}
