services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.4
    container_name: zookeeper-local
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - expense-network

  kafka:
    image: confluentinc/cp-kafka:7.4.4
    container_name: kafka-local
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka-local:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - expense-network

  postgres:
    image: postgres:15
    container_name: postgres-local
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: userservice
    volumes:
      - postgres-local-data:/var/lib/postgresql/data
    networks:
      - expense-network

  redis:
    image: redis:7
    container_name: redis-local
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-local-data:/data
    networks:
      - expense-network
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway" 
    networks:
      - expense-network   # lets container reach localhost services

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"                            # 3000 conflicts with React Native metro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
      - loki
    networks:
      - expense-network 
  loki:
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - expense-network

  promtail:
    image: grafana/promtail:2.9.0
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - /var/log:/var/log                    # system logs
      - /home/greatest/Desktop/backend/expenseTracker:/app  # your service logs
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - expense-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - expense-network
  auth-service:
    build:
      context: ./AuthService1
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "9898:9898"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - KAFKA_BOOTSTRAP_SERVERS=kafka-local:29092
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
      - EUREKA_URI=http://service-discovery:8761/eureka/
    depends_on:
      service-discovery:
        condition: service_healthy
      postgres:
        condition: service_started
      kafka:
        condition: service_started
      zipkin:
        condition: service_started

    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - expense-network

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
      - EUREKA_URI=http://service-discovery:8761/eureka/
    depends_on:
      service-discovery:
        condition: service_healthy
      redis:
        condition: service_started
      zipkin:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - expense-network

  service-discovery:
    build:
      context: ./service-discovery
      dockerfile: Dockerfile
    container_name: service-discovery
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - expense-network



volumes:
  postgres-local-data:
  redis-local-data:

networks:
  expense-network: