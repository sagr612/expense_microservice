apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-service-deployment
  namespace: expense-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: expense-service
  template:
    metadata:
      labels:
        app: expense-service
    spec:
      containers:
        - name: expense-service
          image: expensetracker-expense-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9810
          envFrom:
            - configMapRef:
                name: microservice-config
            - secretRef:
                name: microservice-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "150m"
            limits:
              memory: "768Mi"
              cpu: "750m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 9810
            initialDelaySeconds: 40
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 9810
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: expense-service
  namespace: expense-tracker
spec:
  type: ClusterIP
  selector:
    app: expense-service
  ports:
    - port: 9810
      targetPort: 9810
