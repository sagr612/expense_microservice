server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml   # tracks how far Promtail has read each file

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  - job_name: auth-service
    static_configs:
      - targets:
          - localhost
        labels:
          service: auth-service
          env: local
          __path__: /app/AuthService1/logs/*.log

  - job_name: user-service
    static_configs:
      - targets:
          - localhost
        labels:
          service: user-service
          env: local
          __path__: /app/userService/logs/*.log

  - job_name: expense-service
    static_configs:
      - targets:
          - localhost
        labels:
          service: expense-service
          env: local
          __path__: /app/expenseService/logs/*.log

  - job_name: notification-service
    static_configs:
      - targets:
          - localhost
        labels:
          service: notification-service
          env: local
          __path__: /app/notification-service/logs/*.log

  - job_name: gateway
    static_configs:
      - targets:
          - localhost
        labels:
          service: gateway
          env: local
          __path__: /app/gateway/logs/*.log

  - job_name: ai-service
    static_configs:
      - targets:
          - localhost
        labels:
          service: ai-service
          env: local
          __path__: /app/ai-sms-service/logs/*.log