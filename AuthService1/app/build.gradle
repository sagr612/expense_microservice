plugins {
    id 'java'
    id 'application'
    id 'org.springframework.boot' version '3.2.2'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'org.example'
version = '1.0.0'
sourceCompatibility = '21'

repositories {
    mavenCentral()
}

ext {
    lombokVersion = '1.18.30'
    jjwtVersion = '0.12.5'
    postgresVersion = '42.7.1'
    modelMapperVersion = '3.2.0'
    guavaVersion = '32.1.2-jre'
    junitVersion = '5.10.0'
    set('springCloudVersion', "2023.0.5")
}

dependencies {
    // Spring Boot Starters
    // FIX THIS: Add platform() so Gradle picks up version 1.20.6 from the BOM
    testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:kafka'
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:kafka'
    testImplementation 'org.awaitility:awaitility:4.2.2'
    // PostgreSQL Driver
    implementation "org.postgresql:postgresql:$postgresVersion"
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

//    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'
    // Kafka
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    // JWT
    implementation "io.jsonwebtoken:jjwt-api:$jjwtVersion"
    implementation "io.jsonwebtoken:jjwt-impl:$jjwtVersion"
    implementation "io.jsonwebtoken:jjwt-jackson:$jjwtVersion"
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'
    implementation 'io.zipkin.reporter2:zipkin-reporter-brave'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // ModelMapper
    implementation "org.modelmapper:modelmapper:$modelMapperVersion"

    // Guava
    implementation "com.google.guava:guava:$guavaVersion"
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    // Lombok
    compileOnly "org.projectlombok:lombok:$lombokVersion"
    annotationProcessor "org.projectlombok:lombok:$lombokVersion"
    testCompileOnly "org.projectlombok:lombok:$lombokVersion"
    testAnnotationProcessor "org.projectlombok:lombok:$lombokVersion"

    // Testing
//    testImplementation "org.junit.jupiter:junit-jupiter:$junitVersion"
    // Testing (Spring Boot recommended)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

}

application {
    mainClass = 'org.example.App' // Replace with your actual main class
}

tasks.test {
    useJUnitPlatform()

}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        mavenBom "org.testcontainers:testcontainers-bom:2.0.5"
    }
}