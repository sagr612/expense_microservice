spring:
  application:
    name: auth-service

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:authservice}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:123}

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    show-sql: false
    open-in-view: false

    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true


  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}

    producer:
      bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
      value-serializer: org.example.serializer.UserInfoSerializer
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      observation-enabled: true

    topic-json:
      name: user_service
    listener:
      observation-enabled: true


server:
  port: 9898
  address: 0.0.0.0

jwt:
  secret: /+lOUCWb0YrBbkNfHT4DAXjZ8Ejp1C0NlTwB0Jlq47c=
  expiration: 3600000
  refresh-expiration: 604800000

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.example: DEBUG


#  pattern:
#    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      show-details: when-authorized

  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans




eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true