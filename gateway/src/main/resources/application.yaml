resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 80
        register-health-indicator: true

    instances:
      expense-service-cb:
        base-config: default
      auth-service-cb:
        base-config: default
      user-service-cb:
        base-config: default
        slow-call-duration-threshold: 30s   # so a 7s upload isn't flagged "slow"
      notification-service-cb:
        base-config: default
      ai-service-cb:
        base-config: default
        slow-call-duration-threshold: 10s

  timelimiter:
    configs:
      default:
        timeout-duration: 5s
    instances:
      user-service-cb:
        timeout-duration: 30s        # ← this is the one that was missing
      ai-service-cb:
        timeout-duration: 15s
