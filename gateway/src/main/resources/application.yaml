management:
  endpoints:
    web:
      exposure:
        include: "*"

  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

  endpoint:
    health:
      show-details: always
    gateway:
      access: unrestricted
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    circuitbreakers:
      enabled: true

  tracing:
    enabled: true
    sampling:
      probability: 1.0

  otlp:
    tracing:
      endpoint: http://localhost:9411/v1/traces
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.data.redis: DEBUG
    io.lettuce.core: DEBUG
    org.springframework.cloud.gateway.filter.ratelimit: TRACE

